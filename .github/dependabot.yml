version: 2
updates:
     - package-ecosystem: "npm"
       directory: "/"
       schedule:
            interval: "monthly"
            day: "sunday"
       groups:
            root-js:
                 patterns: ["*"]
       ignore:
            # Tailwind v4 needs a dedicated migration (config moves to a
            # CSS-first @theme block, new PostCSS plugin) - remove this once
            # that migration lands.
            - dependency-name: "tailwindcss"
              versions: [">= 4.0.0"]
            # eslint-config-next's own plugin chain (eslint-plugin-react,
            # eslint-plugin-jsx-a11y) doesn't support eslint 10 yet - remove
            # this once eslint-config-next updates those peer ranges.
            - dependency-name: "eslint"
              versions: [">= 10.0.0"]
